<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 状态灯 · 团队面板</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f172a; color: #e2e8f0; font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 18px 28px; border-bottom: 1px solid #1e293b; position: sticky; top: 0; background: #0f172aee; backdrop-filter: blur(4px); z-index: 5; }
  h1 { font-size: 17px; font-weight: 600; margin-right: auto; }
  h1 small { display: block; font-size: 12px; font-weight: 400; color: #94a3b8; }
  #token { width: 280px; padding: 7px 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-family: Consolas, monospace; font-size: 12px; }
  #token:focus { outline: none; border-color: #38bdf8; }
  button { padding: 7px 16px; background: #38bdf8; border: none; border-radius: 8px; color: #0f172a; font-weight: 600; cursor: pointer; }
  button:hover { background: #7dd3fc; }
  #conn { font-size: 12px; color: #94a3b8; min-width: 90px; }
  #conn.err { color: #f87171; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 28px 60px; }
  #empty { text-align: center; color: #64748b; padding: 80px 0; display: none; }
  .device { background: #1e293b; border-radius: 14px; padding: 16px 20px; margin-bottom: 14px; border: 1px solid transparent; }
  .device:hover { border-color: #334155; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .name { font-size: 15px; font-weight: 600; }
  .host { color: #94a3b8; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.on { background: #34d399; box-shadow: 0 0 6px #34d39988; }
  .dot.off { background: #64748b; }
  .badge { font-size: 11px; color: #94a3b8; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .actions button { padding: 4px 12px; font-size: 12px; font-weight: 400; background: #334155; color: #cbd5e1; }
  .actions button:hover { background: #475569; color: #f1f5f9; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #0ea5e922; color: #38bdf8; border: 1px solid #38bdf844; }
  .none { font-size: 12px; color: #64748b; margin-top: 10px; }
  ul.sessions { list-style: none; margin-top: 10px; border-top: 1px solid #33415555; }
  ul.sessions li { display: flex; gap: 8px; align-items: baseline; padding: 5px 0; font-size: 13px; border-bottom: 1px solid #33415533; flex-wrap: wrap; }
  ul.sessions li:last-child { border-bottom: none; }
  .s-client { color: #94a3b8; font-size: 12px; flex: none; }
  .s-title { color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
  .st { font-size: 12px; flex: none; padding: 0 8px; border-radius: 999px; }
  .st.working { background: #facc1522; color: #facc15; }
  .st.completed { background: #34d39922; color: #34d399; }
  .st.waiting { background: #f8717122; color: #f87171; }
  .st.error { background: #f8717122; color: #f87171; }
  .st.idle { background: #64748b22; color: #94a3b8; }
  .seen { margin-left: auto; font-size: 11px; color: #64748b; flex: none; }
</style>
</head>
<body>
<header>
  <h1>AI 状态灯 · 团队面板<small>内网数据 · 只含软件名 / 状态 / 项目名,不含会话内容</small></h1>
  <span id="conn"></span>
  <input id="token" type="password" placeholder="管理密钥(admin-token.txt)" autocomplete="off">
  <button id="connect">连接</button>
</header>
<main>
  <div id="empty">暂无设备上报。<br>请在成员机器的 AI 状态灯悬浮面板里打开「团队上报」,填写本机地址即可。</div>
  <div id="devices"></div>
</main>
<script>
(function () {
  const $token = document.getElementById('token');
  const $conn = document.getElementById('conn');
  const $devices = document.getElementById('devices');
  const $empty = document.getElementById('empty');
  // 支持 ?token=xxx 直连:存入 localStorage 后从地址栏移除,便于管理员收藏链接
  const urlToken = new URLSearchParams(location.search).get('token');
  if (urlToken) {
    localStorage.setItem('ai-light-admin-token', urlToken);
    history.replaceState(null, '', location.pathname);
  }
  $token.value = localStorage.getItem('ai-light-admin-token') || '';

  const STATE_LABEL = { working: '运行中', completed: '已结束', waiting: '等待处理', error: '异常', idle: '空闲' };

  function ago(ts) {
    const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
    if (s < 60) return s + ' 秒前';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  }

  function esc(text) {
    const div = document.createElement('div');
    div.textContent = String(text == null ? '' : text);
    return div.innerHTML;
  }

  async function refresh() {
    const token = $token.value.trim();
    if (!token) { $conn.textContent = '请填密钥'; $conn.className = 'err'; return; }
    let data;
    try {
      const resp = await fetch('/api/v1/overview', { headers: { Authorization: 'Bearer ' + token } });
      if (resp.status === 401) { $conn.textContent = '密钥错误'; $conn.className = 'err'; return; }
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      data = await resp.json();
    } catch (err) {
      $conn.textContent = '连接失败'; $conn.className = 'err';
      return;
    }
    $conn.textContent = '已连接 · ' + new Date().toLocaleTimeString();
    $conn.className = '';
    localStorage.setItem('ai-light-admin-token', token);
    render(data);
  }

  function render(data) {
    const devices = data.devices || [];
    $empty.style.display = devices.length ? 'none' : 'block';
    $devices.innerHTML = devices.map(d => {
      const chips = (d.activeClients || []).map(c => '<span class="chip">' + esc(c) + '</span>').join('');
      const sessions = (d.sessions || []).map(s =>
        '<li><span class="s-client">' + esc(s.client) + '</span>' +
        '<span class="s-title" title="' + esc(s.title) + '">' + esc(s.title || '(无标题)') + '</span>' +
        '<span class="st ' + esc(s.state) + '">' + (STATE_LABEL[s.state] || esc(s.state)) + '</span></li>'
      ).join('');
      return '<div class="device">' +
        '<div class="head">' +
          '<span class="dot ' + (d.online ? 'on' : 'off') + '"></span>' +
          '<span class="name">' + esc(d.displayName) + '</span>' +
          '<span class="host">@' + esc(d.host) + '</span>' +
          '<span class="badge">' + (d.online ? '在线' : '离线') + '</span>' +
          '<span class="actions">' +
            '<button data-act="rename" data-token="' + esc(d.deviceToken) + '" data-name="' + esc(d.displayName) + '">改名</button>' +
            '<button data-act="delete" data-token="' + esc(d.deviceToken) + '" data-name="' + esc(d.displayName) + '">删除</button>' +
          '</span>' +
        '</div>' +
        (chips ? '<div class="chips">' + chips + '</div>' : '<div class="none">未检测到运行中的 AI 客户端</div>') +
        (sessions ? '<ul class="sessions">' + sessions + '</ul>' : '') +
        '<div class="none">最后上报:' + ago(d.lastSeen) + '</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('connect').addEventListener('click', refresh);
  $token.addEventListener('keydown', e => { if (e.key === 'Enter') refresh(); });

  $devices.addEventListener('click', async e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const token = $token.value.trim();
    const headers = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };
    if (btn.dataset.act === 'rename') {
      const name = prompt('新的显示名:', btn.dataset.name);
      if (!name || !name.trim()) return;
      await fetch('/api/v1/devices/' + encodeURIComponent(btn.dataset.token), { method: 'PATCH', headers, body: JSON.stringify({ displayName: name.trim() }) });
    } else if (btn.dataset.act === 'delete') {
      if (!confirm('确定删除设备「' + btn.dataset.name + '」?它下次上报会重新出现。')) return;
      await fetch('/api/v1/devices/' + encodeURIComponent(btn.dataset.token), { method: 'DELETE', headers });
    }
    refresh();
  });

  refresh();
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
