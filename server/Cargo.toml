[package]
name = "ai-light-team-server"
version = "0.1.0"
description = "LAN team panel for AI Traffic Light device reports"
edition = "2021"

[dependencies]
dirs = "6"
rand = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[[bin]]
name = "ai-light-team-server"
path = "src/main.rs"
