<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Traffic Light</title>
  </head>
  <body data-state="idle">
    <main class="widget" data-panel-open="true">
      <div class="lamps" data-tauri-drag-region>
      <section class="housing" hidden data-client="codex" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>AI</div>
        <div
          class="light light-red"
          data-state="waiting"
          data-tauri-drag-region
        ></div>
        <div
          class="light light-green"
          data-state="completed"
          data-tauri-drag-region
        ></div>
        <div class="client-name" data-tauri-drag-region>Codex</div>
        <div class="client-status" data-tauri-drag-region>未知</div>
      </section>
      <section class="housing" hidden data-client="workbuddy" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>AI</div>
        <div class="light light-red" data-state="waiting" data-tauri-drag-region></div>
        <div class="light light-green" data-state="completed" data-tauri-drag-region></div>
        <div class="client-name" data-tauri-drag-region>WorkBuddy</div>
        <div class="client-status" data-tauri-drag-region>未知</div>
      </section>
      <section class="housing" hidden data-client="marvis" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>AI</div>
        <div class="light light-red" data-state="waiting" data-tauri-drag-region></div>
        <div class="light light-green" data-state="completed" data-tauri-drag-region></div>
        <div class="client-name" data-tauri-drag-region>Marvis</div>
        <div class="client-status" data-tauri-drag-region>暂无状态</div>
      </section>
      <section class="housing" hidden data-client="zcode" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>AI</div>
        <div class="light light-red" data-state="waiting" data-tauri-drag-region></div>
        <div class="light light-green" data-state="completed" data-tauri-drag-region></div>
        <div class="client-name" data-tauri-drag-region>ZCode</div>
        <div class="client-status" data-tauri-drag-region>暂无状态</div>
      </section>
      <section class="housing" hidden data-client="coze" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>AI</div>
        <div class="light light-red" data-state="waiting" data-tauri-drag-region></div>
        <div class="light light-green" data-state="completed" data-tauri-drag-region></div>
        <div class="client-name" data-tauri-drag-region>扣子</div>
        <div class="client-status" data-tauri-drag-region>暂无状态</div>
      </section>
      <section class="housing" hidden data-client="trae" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>AI</div>
        <div class="light light-red" data-state="waiting" data-tauri-drag-region></div>
        <div class="light light-green" data-state="completed" data-tauri-drag-region></div>
        <div class="client-name" data-tauri-drag-region>TRAE</div>
        <div class="client-status" data-tauri-drag-region>暂无状态</div>
      </section>
      <section class="housing" hidden data-client="doubao" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>AI</div>
        <div class="light light-red" data-state="waiting" data-tauri-drag-region></div>
        <div class="light light-green" data-state="completed" data-tauri-drag-region></div>
        <div class="client-name" data-tauri-drag-region>豆包</div>
        <div class="client-status" data-tauri-drag-region>暂无状态</div>
      </section>
      </div>
      <div class="panel-stack">
        <section class="panel">
          <div class="panel-header">
            <strong id="status-label">空闲</strong>
            <button id="open-team" type="button" title="团队上报设置">团队</button>
            <button id="close-panel" type="button" aria-label="收起会话面板" title="收起会话面板">×</button>
          </div>
          <div class="panel-subrow">
            <span id="session-count">暂无会话记录</span>
            <span id="fresh-chip" hidden>刚结束 1</span>
          </div>
          <ul id="session-list" class="session-list"></ul>
          <button id="clear-sessions" class="clear-sessions" type="button" hidden>
            清空已停
          </button>
        </section>
        <section id="hooks-warning" class="panel hooks-warning" hidden>
          <span id="hooks-warning-message">Hooks 缺失或需要更新</span>
          <span id="hooks-status" class="hooks-status" role="status" hidden></span>
          <button id="setup-hooks" type="button">安装 Hooks</button>
        </section>
        <section id="team-panel" class="panel team-panel" hidden>
          <div class="panel-header">
            <strong>团队上报</strong>
            <button id="close-team" type="button" aria-label="关闭团队上报设置" title="关闭">×</button>
          </div>
          <label class="team-row">
            <input id="team-enabled" type="checkbox" />
            <span>启用团队上报</span>
          </label>
          <input id="team-url" class="team-input" type="text" placeholder="服务器 http://192.168.x.x:8787" spellcheck="false" />
          <input id="team-name" class="team-input" type="text" placeholder="显示名(默认用机器名)" spellcheck="false" />
          <div class="team-actions">
            <button id="team-save" type="button">保存</button>
            <span id="team-status" class="team-status" role="status"></span>
          </div>
          <p class="team-note">上报:成员名、机器名、在用软件、会话状态与项目名;不含会话内容。</p>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
